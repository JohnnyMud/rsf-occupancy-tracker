[project]
name = "rsf-occupancy-tracker"
version = "0.1.0"
description = "Campus gym occupancy collector, analysis, and dashboard for UC Berkeley RSF"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash>=4.3.0",
    "dash-bootstrap-components>=2.0.4",
    "google-auth>=2.56.2",
    "gspread>=6.2.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "plotly>=6.8.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
