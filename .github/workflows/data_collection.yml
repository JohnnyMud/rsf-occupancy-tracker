name: Run Python Script at Specific Times

on:
  schedule:
    # Covers all possible RSF hours in PST and PDT. The collector applies the
    # America/Los_Angeles operating-hours check so daylight saving is handled.
    - cron: "*/30 0-7,14-23 * * *"

  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Set up Google Credentials
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}" | base64 --decode > credentials.json

      - name: Run Python Script
        run: uv run --locked --no-dev python rsf_data_collector.py
        env:
          DENSITY_API_KEY: ${{ secrets.DENSITY_API_KEY }}
          DENSITY_API_URL: ${{ secrets.DENSITY_API_URL }}
          MAX_CAPACITY: ${{ secrets.MAX_CAPACITY }}
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
          FORCE_COLLECTION: ${{ github.event_name == 'workflow_dispatch' }}
